<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-obfuscator via esm.sh</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 2rem;
				line-height: 1.5;
			}

			form-obfuscator {
				display: block;
				max-width: 420px;
			}

			label,
			input {
				display: block;
				width: 100%;
				font: inherit;
			}

			input {
				margin-block: 0.5rem 1rem;
				padding: 0.5rem;
			}
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<form-obfuscator>
			<label for="account-number">Account number</label>
			<input id="account-number" name="account" value="1234-5678-9012" />
		</form-obfuscator>

		<script type="module">
			import { FormObfuscatorElement } from 'https://esm.sh/@aarongustafson/form-obfuscator@3.0.0/form-obfuscator.js?bundle&target=es2022';

			if (!customElements.get('form-obfuscator')) {
				customElements.define('form-obfuscator', FormObfuscatorElement);
			}
		</script>
	</body>
</html>
